name: Publish Retype Docs

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: arc-x64-ci
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
      # arc-x64-ci's stock runner image has no node/dotnet; retypeapp/action-build
      # needs node >= 18 (or dotnet) to install the Retype CLI. ubuntu-latest bundled it.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: retypeapp/action-build@latest

      - uses: retypeapp/action-github-pages@latest
        with:
          branch: retype   # 빌드 결과를 retype 브랜치에 push
          update-branch: true