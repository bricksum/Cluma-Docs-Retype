name: Publish Retype Docs

on:
  push:
    branches:
      - main

jobs:
  publish:
    # Public repo: GitHub-hosted minutes are free here (not subject to the org's
    # spending-limit block), and the self-hosted arc-untrusted pool deliberately
    # does not serve public repositories. Stays on ubuntu-latest (#3).
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - uses: retypeapp/action-build@latest

      - uses: retypeapp/action-github-pages@latest
        with:
          branch: retype   # 빌드 결과를 retype 브랜치에 push
          update-branch: true